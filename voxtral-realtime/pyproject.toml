[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxtral-realtime"
version = "0.1.0"
description = "A standalone realtime turn-taking bridge for Voxtral served by vLLM. Install from the X2-Turn checkout; not published to PyPI."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "X Square contributors"}]
dependencies = [
  "fastapi>=0.110",
  "numpy>=1.24",
  "safetensors>=0.4",
  "uvicorn[standard]>=0.27",
  "websockets>=12",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]
transformers = [
  "huggingface-hub",
  "mistral-common",
  "torch",
  "transformers>=5.10.0",
]

[project.scripts]
voxtral-realtime = "voxtral_realtime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voxtral_realtime"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
