[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x2-turn-demo"
version = "0.1.0"
description = "Standalone browser demo for raw X2 Turn predictions. Install from the X2-Turn checkout; not published to PyPI."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "X Square contributors"}]
dependencies = [
  "fastapi>=0.110",
  "numpy>=1.24",
  "python-multipart",
  "soundfile",
  "uvicorn[standard]>=0.27",
  "voxtral-realtime[transformers]>=0.1.0",
  "websockets>=12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
x2-turn-demo = "demo_turn.server:main"

[tool.hatch.build.targets.wheel]
packages = ["demo_turn"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
