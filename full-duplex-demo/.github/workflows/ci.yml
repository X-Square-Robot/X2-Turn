name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core and demo
        run: |
          python -m pip install --upgrade pip
          python -m pip install "voxtral-realtime>=0.1.0" ".[dev]"
      - name: Validate
        run: |
          ruff check .
          pytest
          python scripts/check_public_release.py
          bash -n start_demo.sh scripts/run_app.sh
